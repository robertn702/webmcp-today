name: Publish npm packages

# Tag-triggered, decoupled from the extension release tag. Publish one package:
#   git tag schema-v0.3.0 && git push origin schema-v0.3.0
#   git tag mcp-v0.3.0 && git push origin mcp-v0.3.0
# check-npm-release.mjs validates the target selected by the checked-out tag.
# Tags are protected by a tag ruleset, so they can only be cut from reviewed
# commits.
#
# npm authentication is GitHub Actions OIDC Trusted Publishing: the job
# exchanges its id-token for an npm publication identity. No npm token, no
# NODE_AUTH_TOKEN, no --otp anywhere. Only works on a GitHub-hosted runner
# with npm >= 11.5.1 and Node >= 22.14.0 (both pinned below).
# docs/release-security.md is the runbook for the one-time npmjs and GitHub
# configuration this depends on.
on:
  push:
    tags: ["schema-v*", "mcp-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate install/gates/build without uploading to npm (does not verify OIDC trust)
        type: boolean
        default: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Protected environment (required reviewer) and the npm Trusted Publisher
    # must agree on this name: it is part of the OIDC subject npm checks.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin checkout to this run's immutable commit; tag validation below
          # still uses github.ref_name.
          ref: ${{ github.sha }}
          # Do not leave the repository token in .git/config for dependency
          # scripts invoked by install, checks, or the pack lifecycle.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Trusted publishing requires Node >= 22.14.0 (npm docs); the 24
          # major rides LTS and clears the floor. registry-url is deliberately
          # unset — it would write an empty _authToken into ~/.npmrc and
          # suppress npm's OIDC fallback.
          node-version: "24"

      # Fail before the install: the check only needs the tag and committed
      # package.json files.
      - name: Check tag matches package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # The executed workflow file and the OIDC subject must both come
            # from the protected tag. Running dispatch from a branch would
            # execute an unreviewed copy of this file with the same publishing
            # identity. This guard is defense in depth; the npm-publish
            # environment's tag-only deployment scope is the authoritative
            # barrier (docs/release-security.md).
            if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
              echo "::error::workflow_dispatch must run from the release tag itself (selected ref must be $RELEASE_TAG)"
              exit 1
            fi
          fi
          node scripts/check-npm-release.mjs "$RELEASE_TAG"

      # npm's OIDC trusted-publisher flow needs >= 11.5.1; the runner's stock
      # npm is older. Installed fresh on every run from the public registry —
      # no credentials involved.
      - name: Install npm CLI for Trusted Publishing
        run: npm install --global npm@11.5.1

      - run: bun install --frozen-lockfile

      # A tag can be cut from any commit, so re-run the gates rather than
      # trusting main's green run.
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: node --test scripts/check-npm-release.test.mjs

      - name: Build schema for publish
        if: startsWith(github.ref_name, 'schema-v')
        run: bunx turbo run build --filter=@webmcp-today/schema

      - name: Build MCP bridge for publish
        if: startsWith(github.ref_name, 'mcp-v')
        # The trailing "..." includes the schema dependency in the build, so
        # the bridge's packed dist comes from this commit's schema.
        run: bunx turbo run build --filter=@webmcp-today/mcp-bridge...

      - name: Verify MCP schema dependency is already published
        if: startsWith(github.ref_name, 'mcp-v')
        run: |
          schema_version="$(node -p "require('./packages/mcp/package.json').dependencies['@webmcp-today/schema']")"
          if ! npm view "@webmcp-today/schema@${schema_version}" >/dev/null 2>&1; then
            echo "::error::@webmcp-today/schema@${schema_version} is not published"
            exit 1
          fi

      - name: Verify packed MCP bridge resolves its registry schema dependency
        if: startsWith(github.ref_name, 'mcp-v')
        working-directory: packages/mcp
        run: |
          tarball="$(npm pack --ignore-scripts --json | node --input-type=module -e 'let output = ""; for await (const chunk of process.stdin) output += chunk; const [{ filename }] = JSON.parse(output); process.stdout.write(filename);')"
          prefix="$(mktemp -d)"
          trap 'rm -rf "$prefix"' EXIT
          npm install --prefix "$prefix" --ignore-scripts "./$tarball"
          node --input-type=module -e 'await import(process.argv[1]);' "$prefix/node_modules/@webmcp-today/mcp-bridge/dist/native-host.js"

      - name: Publish @webmcp-today/schema
        if: startsWith(github.ref_name, 'schema-v')
        working-directory: packages/schema
        run: npm publish --access public ${{ inputs['dry-run'] == true && '--dry-run' || '' }}

      - name: Publish @webmcp-today/mcp-bridge
        if: startsWith(github.ref_name, 'mcp-v')
        working-directory: packages/mcp
        run: npm publish --access public ${{ inputs['dry-run'] == true && '--dry-run' || '' }}
