name: Release extension

# Tag-triggered, decoupled from the web app's Vercel deploys. Cut a release
# with:
#   git tag extension-v1.0.1 && git push origin extension-v1.0.1
# The tag version must equal apps/extension/package.json's version — the guard
# below fails the run rather than publishing a mislabeled ZIP.
on:
  push:
    tags: ["extension-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing extension-v* tag to re-release
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # Creating and updating the GitHub Release needs contents: write. Keep that
    # capability isolated from every other workflow and job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Check tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^extension-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $RELEASE_TAG is not a valid extension release tag"
            exit 1
          fi
          pkg="$(node -p "require('./apps/extension/package.json').version")"
          expected_tag="extension-v$pkg"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::tag $RELEASE_TAG does not match apps/extension/package.json version $pkg (expected $expected_tag)"
            exit 1
          fi
          printf 'version=%s\n' "$pkg" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # A tag can be cut from any commit, so re-run the gates rather than
      # trusting main's green run.
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

      # WXT_EXTENSION_KEY pins the extension ID across releases. Without it
      # Chrome derives the ID from the unpacked directory path — a different ID
      # per user — and the install bridge on webmcp.today never answers, since
      # apps/web/lib/extension-bridge.ts probes a fixed ID allowlist. The public
      # key is not a secret (it ships inside manifest.json), hence a repo
      # variable; the matching key.pem is off-repo in 1Password.
      - name: Build release ZIP
        env:
          NODE_ENV: production
          WXT_EXTENSION_KEY: ${{ vars.WXT_EXTENSION_KEY }}
        run: |
          if [ -z "$WXT_EXTENSION_KEY" ]; then
            echo "::error::repo variable WXT_EXTENSION_KEY is unset — the build would ship an unpinned extension ID"
            exit 1
          fi
          # See ci.yml: `bun run --filter` does not scope the cwd in plain bun.
          cd apps/extension
          bun run zip

      # Docs link to the version-less name via
      # https://github.com/robertn702/webmcp-today/releases/latest/download/webmcp-today-chrome.zip
      # — GitHub's /latest redirect resolves by exact asset filename, so a
      # versioned name would break the link on every release. The versioned ZIP
      # stays attached too: it's the citable artifact when someone reports a
      # bug against a specific build.
      - name: Stable-name copy for the /latest/download URL
        working-directory: apps/extension/.output
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp -- "webmcp-today-${VERSION}-chrome.zip" webmcp-today-chrome.zip

      - name: Checksums
        working-directory: apps/extension/.output
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum -- "webmcp-today-${VERSION}-chrome.zip" webmcp-today-chrome.zip > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Extension v${{ steps.version.outputs.version }}
          # Repo-wide "Latest" is set by whichever release claims it. Pinning it
          # here keeps /releases/latest pointing at extension builds; if package
          # releases ever land (npm publishing), mark those make_latest: false.
          make_latest: true
          files: |
            apps/extension/.output/*.zip
            apps/extension/.output/SHA256SUMS
          body: |
            Self-hosted build of the WebMCP Today extension, for use while the
            Chrome Web Store listing is in review.

            ## Install

            1. Download `webmcp-today-${{ steps.version.outputs.version }}-chrome.zip` below and unzip it.
            2. Open `chrome://extensions`, enable **Developer mode**.
            3. **Load unpacked** → select the unzipped folder.
            4. Enable WebMCP at `chrome://flags/#enable-webmcp-testing` and restart Chrome.

            Chrome does not auto-update extensions installed this way — grab a
            new release manually. Chrome will also prompt about developer-mode
            extensions on each launch; that is expected for off-store installs.

            `SHA256SUMS` checks that a downloaded ZIP's bytes match this release.
            It is generated and uploaded by this same release workflow, so it is
            an integrity check, not a detached signature or independent proof of
            publisher identity.
