name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

      # Uses the committed development public key. Release builds override it
      # with their separate key, so this artifact is only for build inspection.
      # NOTE: `bun run --filter` (turbo syntax) does NOT scope the cwd in plain
      # bun — it runs the script from the repo root, so the ZIP would land in
      # ./.output/ instead of apps/extension/.output/. Working-directory pin:
      - name: Build extension ZIP
        working-directory: apps/extension
        run: bun run zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-unsigned-${{ github.sha }}
          path: apps/extension/.output/*.zip
          # upload-artifact filters hidden paths by default, even when the glob
          # names .output/ explicitly — without this the step finds nothing.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
